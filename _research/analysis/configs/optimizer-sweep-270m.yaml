# Optimizer bake-off LR sweep, 270m-moe on mi300 (sweep-optimizers.sh).
#
# Run names are matched WITHOUT the trailing -<slurm-job-id>; restarts of the
# same exp merge automatically. Use `--list` to see merged names, e.g.
#   uv run ../plot_sweeps.py optimizer-sweep-270m.yaml --list | grep 270m
#
# Per group:  label, color (optional), x_key (optional override of the global
# sweep key), and runs: [explicit base names] and/or regex: 'anchored pattern'
# (fullmatch against base names).

project: apertus-v2-optim-baseline
entity: haeggee          # default: API default entity
metric: lm loss
x_key: matrix_lr           # wandb config key for the sweep x-axis
tail_iters: 50             # tail window (in iterations) for the y-axis average
target_iter: 28000       # default: max final iter observed across runs
# extra_history_keys: [learning-rate, grad-norm]   # cached alongside the metric
ylabel: "Loss"

title: "1.2B-270M-A"
subtitle: "Best Run per Optimizer"
subtitle_sweep: "LR Sweep"
cache_dir: ../../results/wandb-cache
out_dir: ../../results/plots
tag: 270m-moe-opt-sweep    # filename stem for plots + summary csv

groups:
  adamw:
    label: AdamW
    regex: '270m-moe-adamw-mlr[0-9.e-]+_lr1e-3_elr1e-3-mi300'
  muon:
    label: Muon
    regex: '270m-moe-muon-lr1e-3-mlr[0-9.e-]+-mi300'
  # muon-radam:
  #   label: Muon (Router)
  #   regex: '270m-moe-muon-lr1e-3-mlr[0-9.e-]+-radam-mi300'
  master:
    label: MASTER
    regex: '270m-moe-master-lr1e-3-mlr[0-9.e-]+-elr1e-3-mi300'
  normuon:
    label: NorMuon
    regex: '270m-moe-normuon-fixed_lr1e-3_mlr[0-9.e-]+-mi300'
  normuon-kimi:
    label: NorMuon (Kimi scaling)
    regex: '270m-moe-normuon-kimi-fixed_lr1e-3_mlr[0-9.e-]+-mi300'
  muown:
    label: Muown
    # two naming generations: ...-mi300-fix and ...-mi300 — both belong here
    regex: '270m-moe-muown-mlr[0-9.e-]+_lr1e-3-mi300(-fix)?'
