# MI300A (mi300 partition) — ROCm Megatron v25.6 + CSCS aws_ofi_nccl/cxi hooks
# (rocm6 variant). Adapted from the verified EDF:
#   /iopsstor/scratch/cscs/schlag/megatron-lm-research-baseline-wsdmc/_research/launch/beverin_v25_6_hooks.toml
# Image is a local copy of schlag's build (rocm_megatron_v25_6_py312).
image = "/iopsstor/scratch/cscs/ahgele/megatron-build/rocm_megatron_v25_6_py312.sqsh"
mounts = ["/capstor", "/iopsstor", "/users"]
workdir = "/iopsstor/scratch/cscs/${USER}/megatron-lm-research-baseline"
writable = true

[annotations]
com.hooks.cxi.enabled = "true"
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "rocm6"

[env]
NCCL_NET = "AWS Libfabric"
NCCL_NET_GDR_LEVEL = "PHB"
NCCL_CROSS_NIC = "1"
NCCL_PROTO = "^LL128"
NCCL_SOCKET_IFNAME = "hsn0,hsn1,hsn2,hsn3"
FI_CXI_DEFAULT_CQ_SIZE = "131072"
FI_CXI_DEFAULT_TX_SIZE = "16384"
FI_CXI_DISABLE_HOST_REGISTER = "1"
FI_CXI_RX_MATCH_MODE = "software"
FI_MR_CACHE_MONITOR = "userfaultfd"
HSA_NO_SCRATCH_RECLAIM = "1"
NVTE_USE_ROCM = "1"
NVTE_USE_HIPBLASLT = "1"
NVTE_FRAMEWORK = "pytorch"
NVTE_ROCM_ARCH = "gfx942"
CUDA_DEVICE_MAX_CONNECTIONS = "1"
# NOTE (2026-06-03 bring-up findings): MBS=8 OOM-kills the node (~500GB RSS)
# in an iteration-1 allocation burst regardless of dispatcher, recompute, or
# allocator config (expandable_segments is unsupported on this ROCm build).
# MBS=4 is the verified setting: ~43GB/rank steady, ~24k tok/s/GPU bf16.
# Launch mi300 runs with MBS=4 in the env.
